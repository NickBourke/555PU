<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="822" viewBox="0 0 1188 822">
<style>
.bg{fill:#fff}
.w{stroke:#111;stroke-width:1.2;fill:none;stroke-linecap:round}
.thin{stroke:#888;stroke-width:0.8;fill:none}
.bus{stroke:#111;stroke-width:2.2;fill:none}
.box{stroke:#111;stroke-width:1.6;fill:#fbfbf4}
.blk{stroke:#234;stroke-width:1.6;fill:#eaf1fb}
.blk2{stroke:#432;stroke-width:1.6;fill:#fbf1e6}
.blk3{stroke:#243;stroke-width:1.6;fill:#eaf7ec}
.solid{fill:#111;stroke:#111;stroke-width:1}
.open{fill:#fff;stroke:#999;stroke-width:1}
.arrow{stroke:#234;stroke-width:1.8;fill:none;marker-end:url(#ah)}
text{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#111}
.lab{fill:#0b4fa8}
.pin{font-size:8.5px;fill:#666}
.val{font-size:9.5px;fill:#444}
.ttl{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:bold}
.sub{font-family:Helvetica,Arial,sans-serif;font-size:12px;fill:#444}
.bt{font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold}
.bs{font-family:Helvetica,Arial,sans-serif;font-size:11px;fill:#333}
.un{font-weight:bold;font-size:12px}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#234"/></marker></defs>
<rect width="100%" height="100%" class="bg"/>
<text x="24.0" y="38.0" class="ttl" text-anchor="start">555-PU block diagram</text>
<text x="24.0" y="58.0" class="sub" text-anchor="start">4-bit accumulator CPU. Blue = 555 timers, green = diode-only logic, orange = clock and I/O.</text>
<g transform="translate(24.0,84.0)">
<rect x="20.0" y="20.0" width="180.0" height="80.0" rx="8" class="blk2"/>
<text x="110.0" y="40.0" class="bt" text-anchor="middle">Clock source</text>
<text x="110.0" y="58.0" class="bs" text-anchor="middle">U1: astable (RUN)</text>
<text x="110.0" y="72.0" class="bs" text-anchor="middle">or STEP button latch</text>
<text x="110.0" y="86.0" class="bs" text-anchor="middle">2 × 555</text>
<rect x="290.0" y="20.0" width="220.0" height="80.0" rx="8" class="blk2"/>
<text x="400.0" y="40.0" class="bt" text-anchor="middle">Clock interlock</text>
<text x="400.0" y="58.0" class="bs" text-anchor="middle">two-phase, non-overlapping</text>
<text x="400.0" y="72.0" class="bs" text-anchor="middle">MEN / SEN never together</text>
<text x="400.0" y="86.0" class="bs" text-anchor="middle">7 × 555</text>
<path d="M200,60 L290,60" class="arrow"/>
<text x="222.0" y="52.0" class="lab" text-anchor="start">SRC</text>
<line x1="510.0" y1="60.0" x2="1050.0" y2="60.0" class="bus"/>
<text x="560.0" y="52.0" class="lab" text-anchor="start">MEN nMEN SEN nSEN → every master / slave latch</text>
<text x="560.0" y="80.0" class="lab" text-anchor="start">nRST → every slave (clear) and nMEN</text>
<rect x="20.0" y="170.0" width="180.0" height="110.0" rx="8" class="blk"/>
<text x="110.0" y="190.0" class="bt" text-anchor="middle">Program counter</text>
<text x="110.0" y="208.0" class="bs" text-anchor="middle">PC0–PC3</text>
<text x="110.0" y="222.0" class="bs" text-anchor="middle">master + slave + inverter</text>
<text x="110.0" y="236.0" class="bs" text-anchor="middle">per bit</text>
<text x="110.0" y="250.0" class="bs" text-anchor="middle">12 × 555</text>
<rect x="290.0" y="170.0" width="160.0" height="110.0" rx="8" class="blk3"/>
<text x="370.0" y="190.0" class="bt" text-anchor="middle">Decoder</text>
<text x="370.0" y="208.0" class="bs" text-anchor="middle">16 word lines</text>
<text x="370.0" y="222.0" class="bs" text-anchor="middle">4-diode AND each</text>
<text x="370.0" y="236.0" class="bs" text-anchor="middle">10k pull-ups</text>
<text x="370.0" y="250.0" class="bs" text-anchor="middle">0 × 555</text>
<rect x="520.0" y="170.0" width="170.0" height="110.0" rx="8" class="blk3"/>
<text x="605.0" y="190.0" class="bt" text-anchor="middle">ROM matrix</text>
<text x="605.0" y="208.0" class="bs" text-anchor="middle">16 words × 8 bits</text>
<text x="605.0" y="222.0" class="bs" text-anchor="middle">diode or DIP+diode</text>
<text x="605.0" y="236.0" class="bs" text-anchor="middle">per 1-bit</text>
<text x="605.0" y="250.0" class="bs" text-anchor="middle">0 × 555</text>
<rect x="760.0" y="170.0" width="180.0" height="110.0" rx="8" class="blk"/>
<text x="850.0" y="190.0" class="bt" text-anchor="middle">ROM restore</text>
<text x="850.0" y="208.0" class="bs" text-anchor="middle">two inverters per bit</text>
<text x="850.0" y="222.0" class="bs" text-anchor="middle">AW ADD J CND I0–I3</text>
<text x="850.0" y="236.0" class="bs" text-anchor="middle">and complements</text>
<text x="850.0" y="250.0" class="bs" text-anchor="middle">16 × 555</text>
<path d="M200,225 L290,225" class="arrow"/>
<text x="214.0" y="217.0" class="lab" text-anchor="start">PC, nPC</text>
<path d="M450,225 L520,225" class="arrow"/>
<text x="458.0" y="217.0" class="lab" text-anchor="start">W0–WF</text>
<path d="M690,225 L760,225" class="arrow"/>
<text x="696.0" y="217.0" class="lab" text-anchor="start">bit lines</text>
<rect x="520.0" y="340.0" width="170.0" height="70.0" rx="8" class="blk2"/>
<text x="605.0" y="360.0" class="bt" text-anchor="middle">Input switches</text>
<text x="605.0" y="378.0" class="bs" text-anchor="middle">SW0–SW3 (DIP)</text>
<text x="605.0" y="392.0" class="bs" text-anchor="middle">ORed into I0–I3 by IN</text>
<path d="M605,340 L605,280" class="arrow"/>
<text x="613.0" y="310.0" class="lab" text-anchor="start">CND·nJ·SWi</text>
<rect x="20.0" y="470.0" width="180.0" height="110.0" rx="8" class="blk3"/>
<text x="110.0" y="490.0" class="bt" text-anchor="middle">Next-state logic</text>
<text x="110.0" y="508.0" class="bs" text-anchor="middle">diode terms wired</text>
<text x="110.0" y="522.0" class="bs" text-anchor="middle">straight into every</text>
<text x="110.0" y="536.0" class="bs" text-anchor="middle">master latch&#x27;s</text>
<text x="110.0" y="550.0" class="bs" text-anchor="middle">TRIG / THR (0 × 555)</text>
<rect x="290.0" y="470.0" width="190.0" height="110.0" rx="8" class="blk"/>
<text x="385.0" y="490.0" class="bt" text-anchor="middle">Adder carry chain</text>
<text x="385.0" y="508.0" class="bs" text-anchor="middle">C1–C3 and nC1–nC3</text>
<text x="385.0" y="522.0" class="bs" text-anchor="middle">ripple, A + IMM</text>
<text x="385.0" y="536.0" class="bs" text-anchor="middle"></text>
<text x="385.0" y="550.0" class="bs" text-anchor="middle">6 × 555</text>
<rect x="560.0" y="470.0" width="180.0" height="110.0" rx="8" class="blk"/>
<text x="650.0" y="490.0" class="bt" text-anchor="middle">Accumulator A</text>
<text x="650.0" y="508.0" class="bs" text-anchor="middle">A0–A3</text>
<text x="650.0" y="522.0" class="bs" text-anchor="middle">3 × 555 per bit</text>
<text x="650.0" y="536.0" class="bs" text-anchor="middle"></text>
<text x="650.0" y="550.0" class="bs" text-anchor="middle">12 × 555</text>
<rect x="800.0" y="470.0" width="150.0" height="110.0" rx="8" class="blk"/>
<text x="875.0" y="490.0" class="bt" text-anchor="middle">Carry flag</text>
<text x="875.0" y="508.0" class="bs" text-anchor="middle">CF</text>
<text x="875.0" y="522.0" class="bs" text-anchor="middle">tested by JC</text>
<text x="875.0" y="536.0" class="bs" text-anchor="middle"></text>
<text x="875.0" y="550.0" class="bs" text-anchor="middle">3 × 555</text>
<rect x="990.0" y="170.0" width="150.0" height="110.0" rx="8" class="blk2"/>
<text x="1065.0" y="190.0" class="bt" text-anchor="middle">LEDs</text>
<text x="1065.0" y="208.0" class="bs" text-anchor="middle">9 LEDs, driven</text>
<text x="1065.0" y="222.0" class="bs" text-anchor="middle">straight from the</text>
<text x="1065.0" y="236.0" class="bs" text-anchor="middle">A0–A3, CF and</text>
<text x="1065.0" y="250.0" class="bs" text-anchor="middle">PC0–PC3 timers</text>
<path d="M850,280 L850,420 L650,420 L650,470" class="arrow"/>
<text x="844.0" y="412.0" class="lab" text-anchor="end">AW ADD I0–I3</text>
<path d="M850,420 L875,420 L875,470" class="arrow"/>
<path d="M850,420 L1080,420 L1080,640 L110,640 L110,580" class="arrow"/>
<text x="130.0" y="632.0" class="lab" text-anchor="start">J CND I0–I3 → PC next-state (jump target)</text>
<path d="M560,510 L480,510" class="arrow"/>
<text x="524.0" y="502.0" class="lab" text-anchor="start">A, nA</text>
<path d="M480,545 L560,545" class="arrow"/>
<text x="492.0" y="561.0" class="lab" text-anchor="start">carries</text>
<path d="M385,580 L385,615 L875,615 L875,580" class="arrow"/>
<text x="505.0" y="609.0" class="lab" text-anchor="start">carry out of bit 3</text>
<path d="M950,525 L990,525 L990,655 L90,655 L90,580" class="arrow"/>
<text x="560.0" y="670.0" class="lab" text-anchor="start">CF, nCF → PC next-state (JC condition)</text>
<path d="M110,470 L110,280" class="arrow"/>
<text x="118.0" y="410.0" class="lab" text-anchor="start">PC + 1 or IMM</text>
<text x="20.0" y="710.0" class="bs" text-anchor="start">Total: 56 logic timers + 2 in U1 = 58 × 555 in 29 × TLC556, plus ~730 diodes. No other active parts.</text>
</g>
</svg>
